name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g., v0.1.0)"
        required: true

permissions: {} # default: no token scopes; jobs opt in below

env:
  CARGO_TERM_COLOR: always
  # Pinned to match ci.yml so the artefacts we ship are produced by the
  # same toolchain CI gates against.
  RUST_TOOLCHAIN: "1.98.1"

jobs:
  detect:
    name: Resolve release target
    runs-on: ubuntu-24.04
    permissions:
      contents: read # read mix.exs, native.ex, and the tags
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-detect
      cancel-in-progress: false
    outputs:
      should_release: ${{ steps.resolve.outputs.should_release }}
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      sha: ${{ steps.resolve.outputs.sha }}
      nif_version: ${{ steps.resolve.outputs.nif_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A dispatch builds the requested tag, so the checkout fails when
          # that tag does not exist.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release target
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          VERSION="$(sed -n 's/^  @version "\([^"]*\)"$/\1/p' mix.exs | head -n1)"
          if [ -z "$VERSION" ]; then
            echo "Failed to read current mix.exs version" >&2
            exit 1
          fi
          TAG="v$VERSION"

          # A push decides from the tag, not from HEAD^: it releases whenever
          # tag v<version> is missing. A push whose last commit is not the
          # bump still releases, and a dropped run releases on the next push
          # to main.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$TAG" != "$INPUT_TAG" ]; then
              echo "Tag $INPUT_TAG has @version $VERSION in mix.exs" >&2
              exit 1
            fi
            SHOULD_RELEASE=true
          elif git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            SHOULD_RELEASE=false
          else
            SHOULD_RELEASE=true
          fi

          # Single source of truth for the NIF version: parse it from the
          # Elixir module that rustler_precompiled compiles against. Keeping
          # it out of `env:` avoids drift if `native.ex` is ever bumped
          # without touching this workflow.
          NIF_VERSION="$(sed -n 's/^[[:space:]]*nif_versions:[[:space:]]*\["\([^"]*\)"\].*$/\1/p' \
            lib/whisper_ct2/native.ex | head -n1)"
          if [ -z "$NIF_VERSION" ]; then
            echo "Failed to parse nif_versions from lib/whisper_ct2/native.ex" >&2
            exit 1
          fi

          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "nif_version=$NIF_VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    if: needs.detect.outputs.should_release == 'true'
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read # checkout the resolved release commit
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-build-${{ matrix.id }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64 Linux: default oneDNN backend, CUDA loaded lazily
          - id: x86_64-unknown-linux-gnu
            suffix: ""
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            lib_ext: so
            features: dnnl cuda-dynamic
            install_cuda: true

          # x86_64 Linux: Intel-tuned MKL variant
          - id: x86_64-unknown-linux-gnu--mkl
            suffix: "--mkl"
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            lib_ext: so
            features: mkl cuda-dynamic
            install_cuda: true

          # aarch64 Linux: Graviton/Grace, oneDNN, optional CUDA via dynamic loading
          - id: aarch64-unknown-linux-gnu
            suffix: ""
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            lib_ext: so
            features: dnnl cuda-dynamic
            install_cuda: true

          # Apple Silicon: Accelerate framework, no CUDA
          # cargo emits .dylib on macOS; rustler_precompiled requests .so
          # for darwin targets (matches Explorer, Tokenizers convention).
          - id: aarch64-apple-darwin
            suffix: ""
            target: aarch64-apple-darwin
            runner: macos-15
            src_ext: dylib
            lib_ext: so
            features: accelerate
            install_cuda: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pin to the SHA detect inspected so artefacts match the version
          # detect resolved, even if `main` moves while the matrix is running.
          ref: ${{ needs.detect.outputs.sha }}
          persist-credentials: false

      # Cross-target toolchain install with component/target selection; the
      # rust-toolchain action is the maintained convention here over hand-rolled rustup.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable # zizmor: ignore[superfluous-actions]
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      # --- Linux build dependencies ---

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake perl libclang-dev pkg-config

      - name: Install CUDA toolkit
        if: matrix.install_cuda
        env:
          ARCH: ${{ runner.arch == 'X64' && 'x86_64' || 'sbsa' }}
        run: |
          # CUDA dynamic-loading still needs the SDK at *build* time to
          # compile the .cu kernels; libcudart is loaded lazily at run time.
          DISTRO=ubuntu2404
          KEYRING=cuda-keyring_1.1-1_all.deb
          wget -q "https://developer.download.nvidia.com/compute/cuda/repos/${DISTRO}/${ARCH}/${KEYRING}"
          sudo dpkg -i "${KEYRING}"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cuda-toolkit-12-6
          echo "PATH=/usr/local/cuda/bin:$PATH" >> "$GITHUB_ENV"

      # --- Build ---

      - name: Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            native/whisper_ct2_native/target
          key: release-${{ matrix.id }}-${{ hashFiles('native/whisper_ct2_native/Cargo.lock') }}
          restore-keys: release-${{ matrix.id }}-

      - name: Build NIF
        working-directory: native/whisper_ct2_native
        env:
          FEATURES: ${{ matrix.features }}
          TARGET: ${{ matrix.target }}
        run: cargo build --release --target "$TARGET" --features "$FEATURES"

      # --- Package ---

      - name: Create tarball
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.detect.outputs.version }}
          NIF_VERSION: ${{ needs.detect.outputs.nif_version }}
          SRC_EXT: ${{ matrix.src_ext || matrix.lib_ext }}
          LIB_EXT: ${{ matrix.lib_ext }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          SRC_DIR="native/whisper_ct2_native/target/${TARGET}/release"
          SRC_NAME="libwhisper_ct2_native.${SRC_EXT}"
          LIB_NAME="libwhisper_ct2_native-v${VERSION}-nif-${NIF_VERSION}-${TARGET}${SUFFIX}.${LIB_EXT}"
          STAGE_DIR="$(mktemp -d)"

          cp "${SRC_DIR}/${SRC_NAME}" "${STAGE_DIR}/${LIB_NAME}"

          tar -czf "${LIB_NAME}.tar.gz" -C "${STAGE_DIR}" .
          rm -rf "${STAGE_DIR}"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nif-${{ matrix.id }}
          path: "*whisper_ct2_native-*.tar.gz"
          if-no-files-found: error

  tag:
    name: Create release tag
    runs-on: ubuntu-24.04
    # Push the tag only after every artefact builds. A failed build then
    # leaves no tag, and the next push to main releases the version.
    needs: [detect, build]
    if: github.event_name == 'push' && needs.detect.outputs.should_release == 'true'
    permissions:
      contents: write # push the release tag
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-tag
      cancel-in-progress: false
    steps:
      # This job pushes the release tag, so the checkout token must persist for
      # the `git push origin "$TAG"` step below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          # Same pinning rationale as the release job: tag must point at the
          # commit detect inspected, not whatever `main` looks like by the
          # time this job runs.
          ref: ${{ needs.detect.outputs.sha }}
          fetch-depth: 0

      - name: Create and push release tag
        env:
          TAG: ${{ needs.detect.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag "$TAG"
          git push origin "$TAG"

  release:
    name: GitHub Release
    needs:
      - detect
      - build
      - tag
    if: always() && needs.detect.outputs.should_release == 'true' && needs.build.result == 'success' && (needs.tag.result == 'success' || needs.tag.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: write # upload assets to the GitHub release
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: nif-*
          merge-multiple: true
          path: artifacts/

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Generate SHA256SUMS
        working-directory: artifacts
        run: sha256sum *.tar.gz | tee SHA256SUMS

      - name: Create release
        # action-gh-release handles asset upload + release-notes generation in one
        # step; replacing it with raw `gh release` calls is not worth the churn here.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3 # zizmor: ignore[superfluous-actions]
        with:
          tag_name: ${{ needs.detect.outputs.tag }}
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
          generate_release_notes: true
